[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "graphist"
version = "0.1.0"
description = "Spatially-aware, pathway-masked variational graph autoencoder for spatial transcriptomics pathway-activity inference (GRAPHIST Stage 2)."
requires-python = ">=3.9"
dependencies = [
    "torch>=1.13,<2.0",
    "torch_geometric>=2.5,<2.6",
    "scanpy>=1.9,<1.10",
    "anndata>=0.8,<0.9",
    "scikit-learn>=1.2,<1.3",
    "scipy>=1.10,<1.11",
    "pandas>=1.5,<1.6",
    "numpy>=1.23,<1.24",
    "umap-learn>=0.5,<0.6",
    "pyyaml>=6.0",
    "tqdm>=4.60",
    "matplotlib>=3.5",
    "seaborn>=0.11",
]

[project.optional-dependencies]
test = ["pytest>=7.0"]

# No console_scripts entry point: use `python scripts/run_pipeline.py --config ...`
# (kept as a plain script since it needs argparse/CLI plumbing, not a bare callable).

[tool.setuptools.packages.find]
include = ["graphist*"]
